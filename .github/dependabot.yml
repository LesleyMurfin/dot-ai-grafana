version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: 'weekly'
    # Wait 5 days before updating to help circumvent supply chain attacks
    cooldown:
      default-days: 5
      # Exclude plugin-e2e to prevent false positives with canary e2e tests
      exclude:
        - '@grafana/plugin-e2e'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'
    ignore:
      # @grafana/data, /runtime, /ui and /schema are pinned together at the
      # reference host version (11.4.x). Bumping one across a major breaks peer
      # resolution outright - npm ci fails with ERESOLVE, as it did in #24 -
      # and would raise the effective Grafana floor above the declared
      # grafanaDependency ">=11.0.0". A major move has to be deliberate and
      # cover all four at once, so Dependabot should not propose it piecemeal.
      # Minor and patch still flow through the `grafana` group below.
      - dependency-name: '@grafana/*'
        update-types:
          - 'version-update:semver-major'
      # eslint-plugin-react is a direct devDependency (also required by
      # @grafana/eslint-config) and caps its eslint peer range at "^9.7",
      # so a major bump breaks peer resolution outright - npm ci fails
      # with ERESOLVE, as it did in #38. @grafana/eslint-config@10 does
      # not rescue this: it still permits the incompatible plugin, and
      # it dropped the ./flat.js export the scaffolded
      # .config/eslint.config.mjs imports. Lift once eslint-plugin-react
      # ships an eslint-10 peer range (jsx-eslint/eslint-plugin-react#3977,
      # fix #4022, both open) and create-plugin scaffolds an
      # eslint-config@10-compatible config - as of create-plugin@7.10.0 it
      # still emits the flat.js import and pins eslint ^9.32.0, so
      # cp-update won't fix this on its own.
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
    groups:
      unit-test:
        patterns:
          - '@testing-library/*'
          - 'jest*'
          - '@types/jest'
      eslint:
        patterns:
          - '@grafana/eslint-config'
          - 'eslint*'
          - '@typescript-eslint/*'
          - '@stylistic/*'
      grafana:
        patterns:
          - '@grafana/*'
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'
    open-pull-requests-limit: 5

  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    allow:
      - dependency-name: 'github.com/grafana/grafana-plugin-sdk-go'
        dependency-type: 'all'
    commit-message:
      prefix: 'chore'
      include: 'scope'
